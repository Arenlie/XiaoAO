[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversation-backend"
version = "1.7.0"
description = "Conversation management backend with three LangGraph execution modes and supervised agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.134,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.51,<2.2",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "redis==8.1.0",
  "httpx[http2]>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "orjson>=3.10,<4.0",
  "structlog>=25.4,<26.0",
  "prometheus-client>=0.22,<1.0",
  "python-json-logger>=3.3,<4.0",
  "opentelemetry-api>=1.35,<2.0",
  "opentelemetry-sdk>=1.35,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.56b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.56b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.56b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.56b0,<1.0",
  "langgraph>=1.2.9,<2.0",
  "langgraph-checkpoint-postgres>=3.1,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "mcp==2.0.0",
  "python-multipart>=0.0.20,<1.0",
  "websockets>=15,<17",
  "minio>=7.2.15,<8.0",
  "pypdf>=6.0,<7.0",
  "python-docx>=1.2,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-pptx>=1.0,<2.0",
  "Pillow>=11.0,<13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
  "testcontainers[postgres,redis]>=4.12,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
